<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Siren beacon, outline style to match BB's stroked icon set (1.75 at a
       24 viewBox). BB renders plugin icons as CSS masks, which key off alpha
       coverage, so the stroke is deliberately an opaque literal rather than
       currentColor — currentColor has no inherited context inside a mask
       source and would not be guaranteed to resolve. -->
  <path d="M7.25 15.25V12a4.75 4.75 0 0 1 9.5 0v3.25"/>
  <rect x="4.5" y="15.25" width="15" height="4.25" rx="1.5"/>
  <path d="M12 2.25v2"/>
  <path d="M4.9 5.4l1.4 1.4"/>
  <path d="M19.1 5.4l-1.4 1.4"/>
</svg>
