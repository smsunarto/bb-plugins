name: CI (Plugins)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a branch makes the first run's verdict irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap checks, together: each is seconds of work behind a shared install,
  # so splitting them further would cost more setup than it saves.
  verify:
    name: Verify (Static)
    runs-on: namespace-profile-linux-8vcpu-16gb-cached
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: ./.github/actions/setup

      - name: Check generated plugin icons
        run: bun run icons:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test (Bun)
    runs-on: namespace-profile-linux-8vcpu-16gb-cached
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      # Nothing here shells out to bb, so this job skips the native node-pty
      # compile the CLI install would otherwise trigger.
      - uses: ./.github/actions/setup
        with:
          bb-cli: "false"

      - name: Test
        run: bun run test

  # The job that decides whether a release would install anywhere. Kept separate
  # from `test` because it is the slow one: it builds every plugin, then packs
  # every plugin again inside publish:dry.
  package:
    name: Package (Tarballs)
    runs-on: namespace-profile-linux-8vcpu-16gb-cached
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      # Two code paths rewrite a manifest in place and restore it afterwards:
      # `bb plugin build` swaps bb.server/bb.app to the sources for the length
      # of a build, and publishUnder() rewrites `name` for the length of one
      # publish. A dirty tree here means one of them did not put it back.
      - name: Guard against a build leaving a manifest rewritten
        run: git diff --exit-code -- 'plugins/*/types/*.d.ts' 'plugins/*/package.json'

      # Packs every publishable plugin and checks the manifest's bb.* paths
      # against the tarball's contents. bb stats those paths at install time,
      # so an allowlist that omits one ships a package that installs nowhere.
      # Also proves both the scoped and unscoped names resolve.
      - name: Check the publishable tarballs
        run: bun run publish:dry
