name: CI (Plugins)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a branch makes the first run's verdict irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap checks, together: each is seconds of work behind a shared install,
  # so splitting them further would cost more setup than it saves.
  verify:
    name: Verify (Static)
    runs-on: namespace-profile-linux-8vcpu-16gb-cached
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: ./.github/actions/setup

      - name: Check generated plugin icons
        run: bun run icons:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test (Bun)
    runs-on: namespace-profile-linux-8vcpu-16gb-cached
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      # NanoCodex's relocation test builds the plugin through the pinned CLI.
      - uses: ./.github/actions/setup
        with:
          bb-cli: "true"

      - name: Test
        run: bun run test

  # The job that decides whether a release would install anywhere. Kept separate
  # from `test` because it is the slow one: it builds and packs every package.
  package:
    name: Package (Tarballs)
    runs-on: namespace-profile-linux-8vcpu-16gb-cached
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      # `bb plugin build` temporarily rewrites bb.server/bb.app while bundling.
      # A dirty tree here means it did not restore the manifest afterwards.
      - name: Guard against a build leaving a manifest rewritten
        run: git diff --exit-code -- 'plugins/*/types/*.d.ts' 'plugins/*/package.json'

      # Checks each package's manifest entry points against the files npm will
      # pack. bb stats plugin bb.* paths at install time, so an omitted path
      # ships a package that installs nowhere.
      - name: Check npm packages
        run: bun run package:check
