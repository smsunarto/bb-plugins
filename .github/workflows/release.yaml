name: Release (npm)

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

# Every main push must wait its turn. It must not interrupt an npm publish
# between a scoped package and its unscoped mirror, or replace a pending run.
concurrency:
  group: release-npm
  cancel-in-progress: false
  queue: max

jobs:
  release-please:
    name: Version and tag packages
    runs-on: ubuntu-24.04
    steps:
      - name: Create package release PRs or GitHub Releases
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}

      - name: Close replaced Changesets release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("changeset-release/")) | .number' |
            while read -r release_pr; do
              gh pr close --repo "$GITHUB_REPOSITORY" "$release_pr" --delete-branch \
                --comment "Replaced by Release Please."
            done

  publish:
    name: Publish released packages
    needs: release-please
    # npm trusted publishing accepts OIDC identities from GitHub-hosted runners,
    # not self-hosted Namespace runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
          no-cache: true

      # Trusted publishing requires npm >=11.5.1. Pin it so an image update
      # cannot silently change the publisher used by this release workflow.
      - name: Install release tools
        run: |
          npm install --global npm@12.0.2 node-gyp
          bun install --frozen-lockfile
          bun install --global "bb-app@$(node -p "require('./package.json').config.bbVersion")"

      # Run after every successful Release Please pass. GitHub Releases and npm
      # are durable stores, so this also retries a prior partial npm publish.
      - name: Publish versions that have a GitHub Release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # `scripts/publish.ts` rewrites each manifest for the unscoped mirror and
      # must restore the original bytes, including after a failed publish.
      - name: Verify manifests were restored
        if: always()
        run: git diff --exit-code -- 'plugins/*/package.json'
