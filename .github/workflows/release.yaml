name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

# Every main push must wait its turn. It must not interrupt an npm publish
# between a scoped package and its unscoped mirror, or replace a pending run.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Create package release PRs or GitHub Releases
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}

  publish:
    name: Publish (${{ matrix.path }})
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    # npm trusted publishing accepts OIDC identities from GitHub-hosted runners,
    # not self-hosted Namespace runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
          no-cache: true

      # Trusted publishing requires npm >=11.5.1. Pin it so an image update
      # cannot silently change the publisher used by this release workflow.
      - name: Install release tools
        run: |
          npm install --global npm@12.0.2 node-gyp
          bun install --frozen-lockfile
          bun install --global "bb-app@$(node -p "require('./package.json').config.bbVersion")"

      - name: Build released package
        env:
          RELEASE_PATH: ${{ matrix.path }}
        run: |
          package_name="$(node -p "require('./$RELEASE_PATH/package.json').name")"
          if [[ "$RELEASE_PATH" == plugins/* ]]; then
            bun run build:framework
          fi
          bun run --filter "$package_name" build

      - name: Upload plugin source maps
        if: ${{ contains(fromJSON('["plugins/amp", "plugins/dotfiles", "plugins/nanocodex", "plugins/notify"]'), matrix.path) }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: |
          case "${{ matrix.path }}" in
            plugins/amp) export SENTRY_PROJECT=bb-plugin-amp ;;
            plugins/dotfiles) export SENTRY_PROJECT=bb-plugin-dotfiles ;;
            plugins/nanocodex) export SENTRY_PROJECT=bb-plugin-nanocodex ;;
            plugins/notify) export SENTRY_PROJECT=bb-plugin-notify ;;
          esac
          bun scripts/sentry-release.ts "${{ matrix.path }}"

      - name: Publish package
        working-directory: ${{ matrix.path }}
        run: npm publish --access public

      # Keep the established unscoped plugin package alongside the canonical
      # scoped package. This checkout is disposable, so the temporary manifest
      # rewrite needs no restoration machinery.
      - name: Publish unscoped plugin package
        if: ${{ startsWith(matrix.path, 'plugins/') }}
        working-directory: ${{ matrix.path }}
        env:
          RELEASE_PATH: ${{ matrix.path }}
        run: |
          npm pkg set "name=bb-plugin-${RELEASE_PATH#plugins/}"
          npm publish --access public
